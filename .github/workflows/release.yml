name: Release POECraftMaster

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify release version
        run: |
          $version = dotnet msbuild POECraftMaster/POECraftMaster.csproj -nologo -getProperty:Version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_NAME -cne "v$version") {
              throw "Tag '$env:GITHUB_REF_NAME' must match project version 'v$version'."
          }

      - name: Publish Windows x64
        run: |
          dotnet publish POECraftMaster/POECraftMaster.csproj -c Release -r win-x64 --self-contained true -o release-publish

      - name: Package release
        run: |
          New-Item -ItemType Directory -Path release-publish/Configs | Out-Null
          Copy-Item -LiteralPath Configs/coordinates.json -Destination release-publish/Configs/coordinates.json
          $archive = "POECraftMaster-$env:GITHUB_REF_NAME-win-x64.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory(
              (Join-Path $PWD 'release-publish'),
              (Join-Path $PWD $archive))

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "POECraftMaster-$env:GITHUB_REF_NAME-win-x64.zip"
          gh release create $env:GITHUB_REF_NAME $archive --verify-tag --generate-notes --title "POECraftMaster $env:GITHUB_REF_NAME"
